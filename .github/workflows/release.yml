name: ColAI Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref_type != 'tag' && github.ref_name != 'main' }}

      - name: Setup Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || 'colai' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/release-keystore.jks
            # Verify if keystore can be opened with configured credentials
            if keytool -list -keystore app/release-keystore.jks -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "Keystore file and password verified successfully."
              echo "has_keystore=true" >> $GITHUB_OUTPUT
            else
              echo "::warning::Keystore password or alias verification failed. Check ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, and KEY_ALIAS in GitHub Secrets. Falling back to build without corrupted keystore."
              rm -f app/release-keystore.jks
              echo "has_keystore=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "No custom keystore found in secrets. Using standard release build configuration."
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APKs (Universal & ABI Splits)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || 'colai' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate & Verify Release APKs
        id: apks
        run: |
          mkdir -p release_artifacts
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release_artifacts/ \;
          ls -lh release_artifacts/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: colai-release-apks
          path: release_artifacts/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release != false)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'v2.0.0' }}
          name: ColAI ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'v2.0.0' }}
          files: release_artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
